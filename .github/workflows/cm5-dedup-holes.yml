name: Deduplicate CM5 mechanical alignment drills with KiCad rule checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/dedup_cm5_alignment_holes.py'
      - '.github/workflows/cm5-dedup-holes.yml'
permissions:
  contents: write
jobs:
  dedup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Check baseline
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Remove only redundant unnumbered NPTHs, synchronize HSS lib
        run: /usr/bin/python3 cm5_mini_host/scripts/dedup_cm5_alignment_holes.py
      - name: Check edited design
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Fail closed if error increases or duplication remains
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def scan(e,d):
              x=Path(e).read_text(errors='replace')
              y=Path(d).read_text(errors='replace')
              er=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',x)
              pa=re.search(r'\*\* Found (\d+) Footprint errors \*\*',y)
              ur=re.search(r'\*\* Found (\d+) unconnected pads \*\*',y)
              if not all((er,pa,ur)):raise SystemExit('Cannot parse KiCad reports')
              return (int(er.group(1)),len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',y,re.M)),
                      int(pa.group(1)),int(ur.group(1)),y.count('[holes_co_located]:'))
          a=scan('reports/erc_before.rpt','reports/drc_before.rpt')
          b=scan('reports/erc_after.rpt','reports/drc_after.rpt')
          print('ERC / hard DRC / footprint parity / unrouted / overlapping holes:',a,'->',b)
          Path('cm5_mini_host/CM5_ALIGNMENT_HOLE_AUDIT.md').write_text(
              f"# CM5 mechanical alignment hole de-duplication\n\nBefore {a}\n\nAfter {b}\n\n"
              "Removed only two no-net, no-number coincident NPTH pads in HSS footprint Module302 while retaining the same two physical holes in GPIO half Module301. "
              "Validated by native pcbnew and original HSS KiCad footprint library roundtrip. Copper, nets, and copper tracks preserved. "
              "Manufacturer connector drawing and 3D assembly still require separate confirmation.\n",encoding='utf-8')
          if a[4]!=2 or b[4]!=0 or b[:4]!=a[:4]:
              raise SystemExit('ABORT: duplicate holes not resolved with unchanged electrical checks')
          PY
      - name: Commit verified design only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/CM5IO.pretty/Raspberry-Pi-5-Compute-Module_HSS.kicad_mod cm5_mini_host/CM5_ALIGNMENT_HOLE_AUDIT.md
          git commit -m "Remove duplicated CM5 HSS NPTH drills while retaining GPIO physical holes"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-npth-dedup-drc
          path: reports/
