name: CM5 MiniHost Rev.B workbench

on:
  workflow_dispatch:
  push:
    branches:
      - minihost-revB-workbench
    paths:
      - 'cm5_mini_host/**'
      - '.github/workflows/minihost-revB-workbench.yml'

permissions:
  contents: read

jobs:
  native-kicad-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          kicad-cli version
      - name: Normalize embedded schematic symbols and passive contacts
        run: python3 cm5_mini_host/scripts/snapshot_embedded_symbols.py
      - name: Correct U602 logic buffer supply rail
        run: python3 cm5_mini_host/scripts/fix_u602_3v3_pi.py
      - name: Remove audited orphan wire and DNP placeholder link
        run: |
          python3 cm5_mini_host/scripts/clean_orphan_wire_revB.py
          python3 cm5_mini_host/scripts/clear_dnp_m303_footprint.py
          python3 cm5_mini_host/scripts/clear_dnp_tp701_footprint.py
      - name: Clean clipped and overlapping silkscreen graphics
        run: python3 cm5_mini_host/scripts/silk_drc_cleanup_revB.py
      - name: Reroute U602 VCC pad to CM5 3.3V copper rail
        run: python3 cm5_mini_host/scripts/reroute_u602_vcc_revB.py
      - name: Inspect U602 VCC rail connectivity before power-net reroute
        run: python3 cm5_mini_host/scripts/inspect_u602_vcc_route.py
      - name: Confirm existing GND zone covers L2 and L5
        run: python3 cm5_mini_host/scripts/verify_existing_gnd_planes_revB.py
      - name: Snapshot exact board-embedded footprint geometry
        run: python3 cm5_mini_host/scripts/snapshot_embedded_footprints_revB.py
      - name: Set proposed JLC06161H-3313 controlled stackup
        run: python3 cm5_mini_host/scripts/set_jlc3313_stackup_revB.py
      - name: Run ERC, DRC and export netlist
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports
          cd cm5_mini_host
          kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc.rpt
          E=$?
          kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb -o ../reports/drc.rpt --schematic-parity
          D=$?
          kicad-cli sch export netlist CM5_MINIMA_3.kicad_sch -o ../reports/cm5.net
          N=$?
          printf 'ERC=%s\nDRC=%s\nNETLIST=%s\n' "$E" "$D" "$N" | tee ../reports/command_status.txt
          test -f ../reports/erc.rpt && test -f ../reports/drc.rpt && test -f ../reports/cm5.net
      - name: Generate route, pad, footprint and project inventories
        run: |
          python3 cm5_mini_host/scripts/pcb_audit.py cm5_mini_host/CM5_MINIMA_3.kicad_pcb reports
          python3 cm5_mini_host/scripts/usb_route_inventory.py
          python3 cm5_mini_host/scripts/verify_usb_parity.py
          python3 cm5_mini_host/scripts/audit_footprint_variants.py cm5_mini_host/CM5_MINIMA_3.kicad_pcb > reports/footprint_variants.txt
      - name: Export board artwork for mechanical and silkscreen review
        run: |
          mkdir -p reports/board-svg
          kicad-cli pcb export svg --mode-multi --output reports/board-svg --layers F.Cu,B.Cu,F.SilkS,B.SilkS,Edge.Cuts --fit-page-to-board --exclude-drawing-sheet --check-zones cm5_mini_host/CM5_MINIMA_3.kicad_pcb
      - name: Hard-error gate
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          if not Path('reports/erc.rpt').exists() or not Path('reports/drc.rpt').exists():
              sys.exit('BLOCKED: native reports were not generated; inspect the earlier failing step')
          erc=Path('reports/erc.rpt').read_text(errors='replace')
          drc=Path('reports/drc.rpt').read_text(errors='replace')
          m=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',erc)
          e=int(m.group(1)) if m else 9999
          d=len(re.findall(r';\s*error\s*$',drc,re.M))
          print(f'ERC errors={e}; DRC hard errors={d}')
          if e or d: sys.exit(1)
          PY
      - name: Fabrication candidate gate and export
        run: |
          bash cm5_mini_host/scripts/export_fab_revB.sh
      - name: Upload checked six-layer fabrication candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minihost-revB-fabrication-candidate
          path: |
            MiniHost_RevB_Fabrication_Candidate.zip
            fab_revB_candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minihost-revB-native-audit
          path: reports/
          if-no-files-found: warn
      - name: Upload complete editable source and local libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minihost-revB-source
          path: |
            cm5_mini_host/
          if-no-files-found: error
          retention-days: 30
