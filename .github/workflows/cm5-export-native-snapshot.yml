name: Export current native CM5 MiniHost snapshot for review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cm5-export-native-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
      - name: Make minimal archive from native project text
        run: |
          mkdir -p release_snap/cm5_mini_host
          cp -a cm5_mini_host/. release_snap/cm5_mini_host/
          echo "Archive source branch minihost-revA git $(git rev-parse HEAD)" > release_snap/SNAPSHOT_COMMIT.txt
          printf '%s\n' "REVIEW-ONLY native KiCad project. Do not order PCB yet: formal board fab DFM, USB/PCIe/HDMI controlled impedance, power/thermal envelope, connector mating and real CM5 boot validation remain." > release_snap/READ_BEFORE_MANUFACTURE.txt
          find release_snap -type f -not -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > release_snap/MANIFEST_SHA256.txt
          find release_snap -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: MiniHost-RevA-complete-native-project-REVIEW-ONLY
          path: release_snap/
