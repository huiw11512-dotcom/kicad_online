name: Prune unused battery power via stub after graph verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/remove_batt_stub_via.py'
      - '.github/workflows/cm5-batt-stub-clean.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Real ERC / DRC before
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Delete only verified unused battery branch
        run: /usr/bin/python3 cm5_mini_host/scripts/remove_batt_stub_via.py
      - name: Real ERC / DRC after
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Strict native KiCad fail-closed gate
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def state(e,d):
              es=Path(e).read_text(errors='replace');ds=Path(d).read_text(errors='replace')
              keys=[]
              for q in [r'ERC messages:\s*\d+\s+Errors\s+(\d+)',r'\*\* Found (\d+) unconnected pads \*\*',r'\*\* Found (\d+) Footprint errors \*\*',r'\*\* Found (\d+) DRC violations \*\*']:
                  m=re.search(q,es if q.startswith("ERC") else ds)
                  if not m:raise SystemExit("Unparseable report")
                  keys.append(int(m.group(1)))
              return keys+[len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',ds,re.M)),ds.count('[via_dangling]:'),ds.count('[track_dangling]:')]
          a=state('reports/erc_before.rpt','reports/drc_before.rpt')
          b=state('reports/erc_after.rpt','reports/drc_after.rpt')
          print('ERC/unrouted/parity/total/hard/via_dangling/track_dangling',a,'->',b)
          if a!=(0,0,0,82,0,2,0) or b!=(0,0,0,81,0,1,0):raise SystemExit("Unsafe battery tail removal")
          Path('cm5_mini_host/BATT_STUB_VIA_AUDIT.md').write_text(
            f"# Unused +BATT power-via stub clean\n\nNative KiCad before: {a}\n\nAfter: {b}\n\n"
            "Removed one 0.60mm 0.40mm-wide In3.Cu track from (81.45,72.50) to (82.05,72.50) and only the branch endpoint F-B via at 81.45,72.50. "
            "The live battery power track on In3.Cu and its through-layer junction at (82.05,72.50) remain. "
            "No pad, net, segment on the remaining battery trunk, or zone outline was changed. "
            "Cloud KiCad ERC/parity/unrouted still zero. No physical battery power-delivery testing claimed.\n",encoding='utf-8')
          PY
      - name: Commit only verified no-regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/BATT_STUB_VIA_AUDIT.md
          git commit -m "Remove unconnected +BATT 0.6mm stub and dangling via, retain power trunk"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battery-via-stub-verified
          path: reports/
