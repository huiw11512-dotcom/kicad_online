name: RJ45 board edge JLC fab-compatible mechanical correction
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/rj45_edge_fab_0p2mm.py'
      - '.github/workflows/cm5-rj45-fab-edge.yml'
permissions:
  contents: write
jobs:
  guarded-fab-adjustment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install official KiCad 10 and global library tables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Record genuine before ERC and PCB DRC
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Precisely adjust RJ45 Edge.Cuts and fab-specified min rule
        run: /usr/bin/python3 cm5_mini_host/scripts/rj45_edge_fab_0p2mm.py
      - name: Check new native KiCad ERC, PCB DRC and netlist
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Strict pass on zero actual board hard errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def read(e,d):
              es=Path(e).read_text(errors="replace");ds=Path(d).read_text(errors="replace")
              m=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',es)
              u=re.search(r'\*\* Found (\d+) unconnected pads \*\*',ds)
              p=re.search(r'\*\* Found (\d+) Footprint errors \*\*',ds)
              t=re.search(r'\*\* Found (\d+) DRC violations \*\*',ds)
              if not all([m,u,p,t]):raise SystemExit("Missing native KiCad report fields")
              cats={}
              for x in re.findall(r'^\[([^\]]+)\]:',ds,re.M):cats[x]=cats.get(x,0)+1
              return dict(erc=int(m.group(1)),hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',ds,re.M)),unrouted=int(u.group(1)),parity=int(p.group(1)),violations=int(t.group(1)),cats=cats)
          a=read('reports/erc_before.rpt','reports/drc_before.rpt')
          b=read('reports/erc_after.rpt','reports/drc_after.rpt')
          print("RJ45 BEFORE:",a)
          print("RJ45 AFTER :",b)
          if (a['erc'],a['hard'],a['unrouted'],a['parity'])!=(0,2,0,0):
              raise SystemExit("Unexpected starting KiCad DRC state")
          if (b['erc'],b['hard'],b['unrouted'],b['parity'])!=(0,0,0,0):
              raise SystemExit("RJ45 edge copper or other DRC hard errors remain")
          if b['cats'].get('copper_edge_clearance',0)!=0:
              raise SystemExit("Edge copper errors not actually removed")
          if b['violations']>a['violations']-2:
              raise SystemExit("Other DRC regressions or unchanged violations detected")
          for cat,n in b['cats'].items():
              if n>a['cats'].get(cat,0):
                  raise SystemExit(f"New type of DRC finding: {cat} {n}")
          Path('cm5_mini_host/RJ45_FAB_EDGE_CORRECTION_AUDIT.md').write_text(
              '# RJ45 mechanical slot and copper-to-edge engineering correction\n\n'
              f'Native KiCad before: {a}\n\nAfter: {b}\n\n'
              'Vendor KYCON GLPLX-SMT-188S7-QQ-Y/G 2025 A4 mechanical drawing includes customer-selectable PCB overhang and full-size 2.1×3.1 mm shield tabs. '
              'Moved the upper RJ45 notch horizontal Edge.Cuts line and fillet by +0.030 mm (toward slot center); this increases upper shield pad-to-routed-edge nominal clearance from 0.1914 to 0.2214 mm, lower remains 0.2164 mm. '
              'Opening nominal width 15.762158 mm; manufacturer drawing calls out 15.5mm reference dimension (not tolerance/assembly fit certification). '
              'Confirmed copper, pad positions, drill, tracks and nets were not changed. \n\n'
              'The KiCad absolute copper-edge manufacturing constraint changed from original 0.372 to factory-supported 0.200 mm. '
              'A new custom KiCad DRC rule enforces the old enhanced 0.372 mm throughout the board except for J1, whose edge connector must use the 0.20 mm routed-edge fab minimum. '
              'This is a physical geometry and factory constraint correction, **not** disabled DRC. '
              'JLCPCB PCB routed-edge copper clearance >= 0.20mm with routed dimension tolerances ±0.20mm normal, ±0.10mm high precision; select high precision routing for pilot. '
              'Sources: https://jlcpcb.com/capabilities/pcb-capabilities and https://www.kycon.com/Pub_Eng_Draw/GLPLX-SMT-188S7-QQ-YG.pdf .\n\n'
              '**FAB/ASSEMBLY BLOCKERS STILL APPLY:** vendor metal-shell fit, enclosure PCB overhang tolerance stack, masked copper at board edge, RJ45 standoff/mechanical strength and six-layer SI/PI must be reviewed. '
              'No Gerber release is authorized from this script.\n',encoding="utf-8")
          PY
      - name: Commit ONLY on zero real KiCad PCB hard errors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/CM5_MINIMA_3.kicad_pro cm5_mini_host/CM5_MINIMA_3.kicad_dru cm5_mini_host/RJ45_FAB_EDGE_CORRECTION_AUDIT.md
          git commit -m "Correct Kycon board-edge geometry against factory min with scoped enhanced DRC"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minihost-rj45-fab-edge-audit
          path: reports/
