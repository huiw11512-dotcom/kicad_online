name: Remove only dead end PWR_BUT stub after native KiCad graph proof
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/prune_pwr_but_via_stub.py'
      - '.github/workflows/cm5-pwr-but-stub.yml'
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Baseline native KiCad ERC/DRC
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Graph-check and prune isolated PWR_BUT F.Cu stub
        run: /usr/bin/python3 cm5_mini_host/scripts/prune_pwr_but_via_stub.py
      - name: Re-run native KiCad ERC/DRC
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Reject any new electrical or geometry warnings
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def get(e,d):
              e=Path(e).read_text(errors='replace');d=Path(d).read_text(errors='replace')
              def fld(p,s):
                  m=re.search(p,s)
                  if not m:raise SystemExit('Cannot parse KiCad result')
                  return int(m.group(1))
              cs={}
              for x in re.findall(r'^\[([^\]]+)\]:',d,re.M):cs[x]=cs.get(x,0)+1
              return (fld(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',e),
                      len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',d,re.M)),
                      fld(r'\*\* Found (\d+) Footprint errors \*\*',d),
                      fld(r'\*\* Found (\d+) unconnected pads \*\*',d),
                      fld(r'\*\* Found (\d+) DRC violations \*\*',d),cs)
          a=get('reports/erc_before.rpt','reports/drc_before.rpt')
          b=get('reports/erc_after.rpt','reports/drc_after.rpt')
          print('PWR_BUT ERC/hard/parity/unrouted/total/categories BEFORE:',a)
          print('AFTER:',b)
          if a[:4]!=(0,0,0,0) or b[:4]!=(0,0,0,0):
              raise SystemExit('Electrical regression on PWR_BUT branch')
          if a[-1].get('via_dangling')!=1 or b[-1].get('via_dangling',0)!=0:
              raise SystemExit('Target via dangling not resolved')
          if b[-1].get('track_dangling',0)!=0 or b[4]>a[4]-1:
              raise SystemExit('Unsafe dangling track or DRC count regression')
          for key,n in b[-1].items():
              if n>a[-1].get(key,0):raise SystemExit('New DRC category '+key)
          Path('cm5_mini_host/PWR_BUT_VIA_TAIL_AUDIT.md').write_text(
              f'# Unused power-button branch cleanup\n\nBefore: {a}\n\nAfter: {b}\n\n'
              'Removed one KiCad-reported unused F/B via at 130.959409,65.559501 and exactly one unbranched F.Cu path back to an electrically connected existing via at 128.25,64.45, which was preserved. '
              'No pad, external button net assignment, or B.Cu route was modified. Full DRC and ERC confirm no orphaned pads or new dangling tracks. '
              'The power button mechanical actuator and logic still need power-on testing.\n',encoding='utf-8')
          PY
      - name: Commit only if safe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/PWR_BUT_VIA_TAIL_AUDIT.md
          git commit -m "Prune isolated power button via stub with native KiCad graph and parity check"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-power-button-dead-stub
          path: reports/
