name: A1 Native KiCad ERC and Netlist
on:
  push:
    branches:
      - 'work/a1-baseline-ddr-audit-20261116'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schematic-erc:
    name: Validate A1 schematic using KiCad 9
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli version
      - name: Export root netlist, BOM, PDF and run ERC
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          cd hardware/kicad
          kicad-cli sch export netlist --output ../../artifacts/A1.net A1.kicad_sch 2>&1 | tee ../../artifacts/netlist.log
          net_rc=${PIPESTATUS[0]}
          kicad-cli sch export bom --output ../../artifacts/A1-BOM.csv A1.kicad_sch 2>&1 | tee ../../artifacts/bom.log
          bom_rc=${PIPESTATUS[0]}
          kicad-cli sch export pdf --output ../../artifacts/A1-Schematic.pdf A1.kicad_sch 2>&1 | tee ../../artifacts/pdf.log
          pdf_rc=${PIPESTATUS[0]}
          kicad-cli sch erc --format json --output ../../artifacts/A1-erc.json --exit-code-violations A1.kicad_sch 2>&1 | tee ../../artifacts/erc.log
          erc_rc=${PIPESTATUS[0]}
          cd ../..
          python3 - <<'PY'
          import csv,re,os
          net=open("artifacts/A1.net",encoding="utf-8").read() if os.path.exists("artifacts/A1.net") else ""
          comps=re.findall(r'\(comp \(ref "([^"]+)"\)',net)
          try:
              with open("artifacts/A1-BOM.csv",newline="",encoding="utf-8-sig") as f:
                  bom=list(csv.DictReader(f))
          except Exception:
              bom=[]
          with open("artifacts/netlist-bom-summary.txt","w") as f:
              f.write(f"netlist_component_records={len(comps)}\n")
              f.write(f"bom_rows={len(bom)}\n")
              f.write("netlist_refs="+",".join(comps)+"\n")
          PY
          printf 'netlist_rc=%d\nbom_rc=%d\npdf_rc=%d\nerc_rc=%d\n' "$net_rc" "$bom_rc" "$pdf_rc" "$erc_rc" > artifacts/status.txt
          test "$net_rc" -eq 0 && test "$bom_rc" -eq 0 && test "$pdf_rc" -eq 0 && test "$erc_rc" -eq 0
      - name: Archive ERC, netlist, BOM and full schematic PDF even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A1-KiCad9-ERC
          path: artifacts/
