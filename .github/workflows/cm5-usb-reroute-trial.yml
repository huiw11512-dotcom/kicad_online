          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/USB_REROUTE_AUDIT.md
          git commit -m "Shorten USB701 A7 N backside return branch with DRC no-regression"
          git push origin HEAD:minihost-revA
