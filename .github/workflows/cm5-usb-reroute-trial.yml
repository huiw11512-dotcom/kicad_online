name: Trial USB701 A7 differential-branch reroute (DRC guarded)
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/apply_usb701_a7_reroute.py'
      - '.github/workflows/cm5-usb-reroute-trial.yml'
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad and stock libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
      - name: Record baseline DRC
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/usb_before_drc.rpt) || true
      - name: Reroute only the physically measured USB701 A7 branch
        run: /usr/bin/python3 cm5_mini_host/scripts/apply_usb701_a7_reroute.py
      - name: Verify new DRC and inspect routed PCB
        run: |
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/usb_after_drc.rpt) || true
          /usr/bin/python3 cm5_mini_host/scripts/usb_route_inventory.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          def metrics(path):
              txt=Path(path).read_text(errors='replace')
              hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*,txt,re.M))
              m=re.search(r'Found (\d+) unconnected pads',txt)
              return hard,int(m.group(1)) if m else 999
          before=metrics('reports/usb_before_drc.rpt')
          after=metrics('reports/usb_after_drc.rpt')
          print('DRC hard errors/unconnected:',before,'->',after)
          doc=f"# USB701 A7 controlled PCB reroute\n\nBefore hard errors / unconnected: {before}\n\nAfter hard errors / unconnected: {after}\n\nRemoved six N B.Cu segments, replaced with one direct B.Cu segment from (85.8,63.9) to (86.452,59.7) mm. Both existing vias and all other nets are retained. The new PCB must still be reviewed for actual routed reference plane and SI margin.\n"
          Path('cm5_mini_host/USB_REROUTE_AUDIT.md').write_text(doc)
          if after[0]>before[0] or after[1]>before[1] or after[1]!=0:
              raise SystemExit('ABORT: candidate worsened DRC or connectivity — no PCB commit')
          PY
      - name: Preserve original and commit candidate only after DRC no-regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/USB_REROUTE_AUDIT.md
          git commit -m "Shorten USB701 A7 N backside return branch with DRC no-regression"
          git push origin HEAD:minihost-revA
      - name: Upload before-after DRC and USB net geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb701-a7-geometry-trial
          path: reports/
