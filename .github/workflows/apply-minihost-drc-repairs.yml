name: Apply conservative MiniHost Rev.A DRC repairs
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/apply_safe_drc_repairs.py'
      - '.github/workflows/apply-minihost-drc-repairs.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
      - name: Apply verified mechanical-pad and zone-priority fixes
        run: /usr/bin/python3 cm5_mini_host/scripts/apply_safe_drc_repairs.py
      - name: Commit repaired PCB
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb
          if git diff --cached --quiet; then
            echo "No PCB changes required; DRC repairs already applied"
          else
            git commit -m "Fix NPTH locating holes and M2_3V3 zone priority"
            git push origin HEAD:minihost-revA
          fi
