name: Bootstrap CM5 MiniHost baseline

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-cm5-minihost.yml

permissions:
  contents: write

jobs:
  import-open-hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch pinned, licensed CM5 MINIMA R3 KiCad source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/piecol/CM5_MINIMA_REV3.git /tmp/cm5_reference
          test "$(git -C /tmp/cm5_reference rev-parse HEAD)" = "6d77314dbbc26c8f5735add30ccb0588816cb71a"
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('/tmp/cm5_reference')
          dest=Path('cm5_mini_host')
          dest.mkdir(exist_ok=True)
          needed=['CM5_MINIMA_3.kicad_pcb','CM5_MINIMA_3.kicad_pro','CM5_MINIMA_3.kicad_sch','CM5.kicad_sch','DSI_CSI.kicad_sch','Ethernet.kicad_sch','HDMI.kicad_sch','IO.kicad_sch','PCIe-M2.kicad_sch','USB.kicad_sch','fp-lib-table','LICENSE.txt']
          for name in needed:
              assert (src/name).is_file(), name
              shutil.copy2(src/name,dest/name)
              print('Imported',name,(dest/name).stat().st_size)
          shutil.copy2(src/'README.md',dest/'SOURCE_README.md')
          extra_bytes=0
          for d in ('CM5IO.pretty','CM5IO.3dshapes','3d_lib'):
              for p in (src/d).rglob('*'):
                  if not p.is_file() or p.stat().st_size>3_000_000:
                      continue
                  if extra_bytes+p.stat().st_size > 26_000_000:
                      continue
                  q=dest/p.relative_to(src)
                  q.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,q)
                  extra_bytes+=p.stat().st_size
          print('Optional libraries/models copied:',extra_bytes,'bytes')
          assert (dest/'CM5_MINIMA_3.kicad_pcb').stat().st_size>100000
          PY
      - name: Commit the attributed source to the project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host
          if git diff --cached --quiet; then
            echo "Already imported"
          else
            git commit -m "Import licensed CM5 MINIMA R3 PCB baseline into mini-host workspace"
            git push origin HEAD:main
          fi
