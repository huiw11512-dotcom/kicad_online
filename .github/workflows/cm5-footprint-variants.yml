name: Audit repeated embedded footprint variants
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/audit_footprint_variants.py'
      - '.github/workflows/cm5-footprint-variants.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
      - name: Audit all embedded footprint variants
        run: /usr/bin/python3 cm5_mini_host/scripts/audit_footprint_variants.py
      - name: Commit read-only report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/FOOTPRINT_VARIANT_CONFLICTS.md cm5_mini_host/FOOTPRINT_VARIANT_CONFLICTS.json
          git commit -m "Report differing embedded footprints sharing identical library IDs"
          git push origin HEAD:minihost-revA
