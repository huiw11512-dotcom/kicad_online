name: Trial removal of 3 dangling signal vias with DRC guard
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/remove_3_dangling_vias.py'
      - '.github/workflows/cm5-remove-dangling-vias.yml'
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10 and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Original ERC / DRC
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Remove only three exact single-layer dangling vias
        run: /usr/bin/python3 cm5_mini_host/scripts/remove_3_dangling_vias.py
      - name: Recheck ERC, DRC, and netlist parity
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Require zero dangling vias, zero net regression, same two edge blockers
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def parse(e,d):
              a=Path(e).read_text(errors='replace')
              b=Path(d).read_text(errors='replace')
              m=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',a)
              fp=re.search(r'\*\* Found (\d+) Footprint errors \*\*',b)
              un=re.search(r'\*\* Found (\d+) unconnected pads \*\*',b)
              tot=re.search(r'\*\* Found (\d+) DRC violations \*\*',b)
              if not all([m,fp,un,tot]):raise SystemExit('Invalid DRC/ERC summary')
              cats={}
              for match in re.findall(r'^\[([^\]]+)\]:',b,re.M):cats[match]=cats.get(match,0)+1
              return dict(erc=int(m.group(1)),hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',b,re.M)),
                          parity=int(fp.group(1)),unconnected=int(un.group(1)),dangling=cats.get('via_dangling',0),
                          total=int(tot.group(1)),categories=cats)
          a=parse('reports/erc_before.rpt','reports/drc_before.rpt')
          b=parse('reports/erc_after.rpt','reports/drc_after.rpt')
          print('Before:',a,'After:',b)
          if (a['erc'],a['hard'],a['parity'],a['unconnected'],a['dangling'])!=(0,2,0,0,3):
              raise SystemExit('Unexpected baseline, refusing edit')
          if (b['erc'],b['hard'],b['parity'],b['unconnected'],b['dangling'])!=(0,2,0,0,0):
              raise SystemExit('Electrical or DRC regression')
          if b['total']>a['total']-3:raise SystemExit('Insufficient DRC improvement')
          for k,n in b['categories'].items():
              if n>a['categories'].get(k,0):
                  raise SystemExit(f'New DRC violations of category {k}: {n}')
          Path('cm5_mini_host/DANGLING_VIA_AUDIT.md').write_text(
              "# MiniHost Rev.A dangling-via candidate\n\n"
              f"Before: {a}\n\nAfter: {b}\n\n"
              "Exact removed via centers from KiCad DRC: /USB_C.D_P (85.8480,48.5204), /CM5/PWR_BUT (130.9594,65.5595), +BATT (81.4500,72.5000) mm. "
              "Each had track endpoints on at most one copper layer. Existing copper tracks, SMT pads, net names and board outline were not changed. "
              "This eliminates unused plated-via discontinuities on selected signal nets, but does not constitute SI/PI signoff.\n",encoding='utf-8')
          PY
      - name: Commit only if DRC improves without connectivity regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/DANGLING_VIA_AUDIT.md
          git commit -m "Remove three verified dangling signal vias with no PCB connectivity regression"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-dangling-via-drc
          path: reports/
