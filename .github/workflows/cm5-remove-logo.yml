name: Remove non-electrical board logo with KiCad DRC parity guard
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/remove_reference_logo.py'
      - '.github/workflows/cm5-remove-logo.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10 and standard libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
      - name: Baseline ERC and schematic-parity DRC
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Remove PCB-only artwork after validating no pads
        run: /usr/bin/python3 cm5_mini_host/scripts/remove_reference_logo.py
      - name: Check unchanged electrical rules and zero footprint parity mismatches
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          def metrics(e,d):
              s=Path(e).read_text(errors='replace')
              t=Path(d).read_text(errors='replace')
              m=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',s)
              n=re.search(r'\*\* Found (\d+) Footprint errors \*\*',t)
              if not m or not n:raise SystemExit('Unparseable KiCad reports; refuse to commit')
              hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',t,re.M))
              unr=re.search(r'\*\* Found (\d+) Unconnected pads \*\*',t)
              return int(m.group(1)),hard,int(n.group(1)),int(unr.group(1)) if unr else 0
          before=metrics('reports/erc_before.rpt','reports/drc_before.rpt')
          after=metrics('reports/erc_after.rpt','reports/drc_after.rpt')
          print('ERC errors, hard DRC errors, parity warnings, unconnected:',before,'->',after)
          Path('cm5_mini_host/LOGO_CLEANUP_AUDIT.md').write_text(
              f'# Clean decorative PCB-only footprint\n\nBefore (ERC, hard DRC, footprint parity, unconnected): {before}\n\nAfter: {after}\n\n'
              'Removed one pad-free generic KiCad decorative logo (REF**) from PCB. '
              'No electrically connected footprint, track, net or via was intentionally modified. '
              'Upstream copyright and CERN-OHL-S-2.0 license remain in SOURCE_README and LICENSE.txt.\n',encoding='utf-8')
          if before[2]!=1 or after[2]!=0 or after[0]>before[0] or after[1]>before[1] or after[3]>before[3]:
              raise SystemExit('BLOCKED: expected 1 to 0 footprint parity cleanup without electrical regression')
          PY
      - name: Commit validated edit to MiniHost branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/LOGO_CLEANUP_AUDIT.md
          git commit -m "Remove PCB-only demo logo, close last schematic footprint parity warning"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-logo-parity-report
          path: reports/
