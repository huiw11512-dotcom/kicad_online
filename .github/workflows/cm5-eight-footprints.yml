name: Eight footprint actual pad-by-pad geometry audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/detail_8_footprint_risks.py'
      - '.github/workflows/cm5-eight-footprints.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10 libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
      - name: Compare eight components without changing PCB
        run: /usr/bin/python3 cm5_mini_host/scripts/detail_8_footprint_risks.py
      - name: Commit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/EIGHT_FOOTPRINT_PAD_DELTA.md
          git commit -m "Publish exact pad coordinates and sizes for eight high-risk library mismatches"
          git push origin HEAD:minihost-revA
