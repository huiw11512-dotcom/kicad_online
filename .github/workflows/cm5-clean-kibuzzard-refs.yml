name: Clean 27 KiBuzzard tiny dummy references from MiniHost DRC
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/hide_kibuzzard_dummy_refs.py'
      - '.github/workflows/cm5-clean-kibuzzard-refs.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10 with official libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Baseline ERC / DRC
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Hide only near-zero dummy reference fields
        run: /usr/bin/python3 cm5_mini_host/scripts/hide_kibuzzard_dummy_refs.py
      - name: Recheck ERC / DRC
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Require min-text warnings to vanish without electrical regressions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def report(e,d):
              s=Path(e).read_text(errors='replace')
              t=Path(d).read_text(errors='replace')
              x=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',s)
              y=re.search(r'\*\* Found (\d+) Footprint errors \*\*',t)
              z=re.search(r'\*\* Found (\d+) unconnected pads \*\*',t)
              total=re.search(r'\*\* Found (\d+) DRC violations \*\*',t)
              if not all([x,y,z,total]):raise SystemExit("Invalid KiCad report, aborting")
              return dict(erc=int(x.group(1)),hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',t,re.M)),
                          parity=int(y.group(1)),unconnected=int(z.group(1)),
                          text_height=t.count('[text_height]:'),text_thickness=t.count('[text_thickness]:'),
                          total=int(total.group(1)))
          a=report('reports/erc_before.rpt','reports/drc_before.rpt')
          b=report('reports/erc_after.rpt','reports/drc_after.rpt')
          print("DRC before:",a)
          print("DRC after :",b)
          if (a['erc'],a['hard'],a['parity'],a['unconnected'])!=(0,2,0,0):
              raise SystemExit("Unexpected baseline status")
          if (b['erc'],b['hard'],b['parity'],b['unconnected'])!=(0,2,0,0):
              raise SystemExit("Electrical/DRC baseline regression")
          if (a['text_height'],a['text_thickness'])!=(27,27) or (b['text_height'],b['text_thickness'])!=(0,0):
              raise SystemExit("Text warning cleanup incomplete or unexpected")
          if b['total']>a['total']-54:raise SystemExit("Not all 54 text warnings were removed")
          Path('cm5_mini_host/KIBUZZARD_REFERENCE_AUDIT.md').write_text(
              f"# Tiny KiBuzzard generated reference cleanup\n\nBefore: {a}\n\nAfter: {b}\n\n"
              "Set 27 KiBuzzard footprint reference fields to hidden. Each was <0.01 mm in size, carried no pad and is not the actual visual label. "
              "All original silkscreen polygons remain; native KiCad reload confirms no track, pad, net, placement or zone changes. "
              "This is a visible-label-preserving DRC fix, not disabling a rule globally.\n",encoding='utf-8')
          PY
      - name: Commit only validated footprint reference visibility changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/KIBUZZARD_REFERENCE_AUDIT.md
          git commit -m "Hide 27 dummy KiBuzzard footprint references, preserve visible polygon labels"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-kibuzzard-reference-drc
          path: reports/
