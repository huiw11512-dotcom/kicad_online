name: Build missing KiCad custom footprint libraries
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/export_embedded_footprints.py'
      - '.github/workflows/cm5-footprint-snapshot.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10.0.x
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
      - name: Extract, save, and verify native footprint libraries
        run: /usr/bin/python3 cm5_mini_host/scripts/export_embedded_footprints.py
      - name: Commit library files to working branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/EasyEDA.pretty cm5_mini_host/Samacsys.pretty cm5_mini_host/_pico.pretty cm5_mini_host/fp-lib-table cm5_mini_host/FOOTPRINT_SNAPSHOT.json cm5_mini_host/FOOTPRINT_LIBRARIES.md
          if git diff --cached --quiet; then
            echo "Footprint snapshot already committed"
          else
            git commit -m "Add roundtrip-verified project-local board footprint snapshots"
            git push origin HEAD:minihost-revA
          fi
