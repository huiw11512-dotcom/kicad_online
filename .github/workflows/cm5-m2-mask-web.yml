name: J701 M2 0.16mm mask bridge real fabrication-rule correction
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/m2_mask_web_0p16mm.py'
      - '.github/workflows/cm5-m2-mask-web.yml'
permissions:
  contents: write
jobs:
  fix-mask-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10 with standard libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Verify original electrical status and mask
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Set 69 M2 pin solder-mask expansions, preserving copper
        run: /usr/bin/python3 cm5_mini_host/scripts/m2_mask_web_0p16mm.py
      - name: Test native KiCad schematic and PCB again
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Commit only with 54 -> 0 mask-warning reduction and no electrical change
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def scan(e,d):
              s=Path(e).read_text(errors='replace')
              t=Path(d).read_text(errors='replace')
              m=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',s)
              p=re.search(r'\*\* Found (\d+) Footprint errors \*\*',t)
              u=re.search(r'\*\* Found (\d+) unconnected pads \*\*',t)
              n=re.search(r'\*\* Found (\d+) DRC violations \*\*',t)
              if not all([m,p,u,n]):raise SystemExit("Unparseable KiCad report")
              return dict(erc=int(m.group(1)),hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',t,re.M)),
                  parity=int(p.group(1)),unconnected=int(u.group(1)),mask=t.count('[solder_mask_bridge]:'),
                  total=int(n.group(1)))
          a=scan('reports/erc_before.rpt','reports/drc_before.rpt')
          b=scan('reports/erc_after.rpt','reports/drc_after.rpt')
          print('Before:',a,'After:',b)
          if (a['erc'],a['hard'],a['parity'],a['unconnected'])!=(0,2,0,0) or (b['erc'],b['hard'],b['parity'],b['unconnected'])!=(0,2,0,0):
              raise SystemExit("Electrical DRC/parity regression, block change")
          if a['mask']!=54 or b['mask']!=0 or b['total']>=a['total']-54:
              raise SystemExit("M2 mask correction failed to resolve 54 bridges")
          Path('cm5_mini_host/J701_MASK_BRIDGE_AUDIT.md').write_text(
              f"# J701 M.2 copper-preserving mask expansion correction\n\nBefore: {a}\n\nAfter: {b}\n\n"
              "**Physical geometry:** copper pad width 0.3mm, pitch 0.5mm. Original per-pad mask expansion 0.102mm on each edge yields -0.004mm aperture overlap. "
              "Corrected to 0.020mm per edge, giving 0.16mm nominal mask dam. All 69 J701 pad copper sizes, positions, nets, paste, vias and other PCB geometry preserved; M.2 project footprint synchronized.\n\n"
              "**Factory-specific:** proposed process is JLCPCB 6-layer PCB, green LDI solder mask, outer 1oz copper. JLCPCB official stated soldermask bridge min 0.10mm for 1oz green, per https://jlcpcb.com/capabilities/Capabilities . "
              "The design's 0.16mm nominal bridge is not a guarantee of defect-free production; mask registration and stackup must be verified by the selected fabricator. "
              "2oz copper or black/white mask may require different minimum widths.\n\n"
              "This reduces DRC violations without weakening/waiving board rules and without modifying M.2 copper pad or connector pitch.\n",encoding='utf-8')
          PY
      - name: Commit verified manufacturing improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb "cm5_mini_host/CM5IO.pretty/M.2 M Key socket_2230_2242.kicad_mod" cm5_mini_host/J701_MASK_BRIDGE_AUDIT.md
          git commit -m "Correct M2 pad-local mask expansion, preserve 0.16mm nominal soldermask web"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-m2-mask-web-drc
          path: reports/
