name: Audit 50 KiCad footprint library mismatches against pad geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/compare_50_footprint_mismatches.py'
      - '.github/workflows/cm5-footprint-geometry-audit.yml'
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad and official footprint libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Export current DRC to anchor the precise mismatch list
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc.rpt) || true
      - name: Analyze 50 mismatches without touching board layout
        run: /usr/bin/python3 cm5_mini_host/scripts/compare_50_footprint_mismatches.py
      - name: Commit review report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/FOOTPRINT_MISMATCH_PAD_AUDIT.md
          git commit -m "Audit 50 library warnings by actual pad dimensions, drill and local geometry"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-footprint-geometry-audit
          path: reports/
