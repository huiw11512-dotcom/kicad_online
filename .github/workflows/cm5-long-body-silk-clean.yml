name: Move one CM5 body silhouette away from real switches
on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/scripts/move_cm5_outline_to_fab.py'
      - '.github/workflows/cm5-long-body-silk-clean.yml'
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minihost-revA
          persist-credentials: true
      - name: Install KiCad 10 official packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
      - name: Baseline actual KiCad
        run: |
          mkdir -p reports
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_before.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_before.rpt) || true
      - name: Relocate nonfunctional long CM5 body stroke to fabrication layer
        run: /usr/bin/python3 cm5_mini_host/scripts/move_cm5_outline_to_fab.py
      - name: Recheck actual KiCad
        run: |
          (cd cm5_mini_host && kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc_after.rpt) || true
          (cd cm5_mini_host && kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb --schematic-parity -o ../reports/drc_after.rpt) || true
      - name: Strict silkscreen warning improvement gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def state(e,d):
              es=Path(e).read_text(errors='replace');ds=Path(d).read_text(errors='replace')
              def find(p,s):
                  m=re.search(p,s)
                  if not m:raise SystemExit('Missing DRC report field')
                  return int(m.group(1))
              categories={}
              for typ in re.findall(r'^\[([^\]]+)\]:',ds,re.M):categories[typ]=categories.get(typ,0)+1
              return dict(erc=find(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',es),
                          hard=len(re.findall(r'^\s+Rule:[^\n]*;\s*error\s*$',ds,re.M)),
                          parity=find(r'\*\* Found (\d+) Footprint errors \*\*',ds),
                          unrouted=find(r'\*\* Found (\d+) unconnected pads \*\*',ds),
                          total=find(r'\*\* Found (\d+) DRC violations \*\*',ds),
                          cats=categories)
          a=state('reports/erc_before.rpt','reports/drc_before.rpt')
          b=state('reports/erc_after.rpt','reports/drc_after.rpt')
          print('Before:',a,'After:',b)
          if (a['erc'],a['hard'],a['parity'],a['unrouted'])!=(0,0,0,0) or (b['erc'],b['hard'],b['parity'],b['unrouted'])!=(0,0,0,0):
              raise SystemExit('Unexpected electrical DRC status')
          if a['cats'].get('silk_over_copper')!=7 or b['cats'].get('silk_over_copper',99)>1 or b['total']>a['total']-6:
              raise SystemExit('Failed to correct six real silk collisions at SW101/SW501')
          for cat,n in b['cats'].items():
              if n>a['cats'].get(cat,0):raise SystemExit('Introduced new warning class: '+cat)
          Path('cm5_mini_host/CM5_BODY_SILK_VS_SWITCH_AUDIT.md').write_text(
              f'# Mechanical CM5 body contour vs mounted switches\n\nBefore: {a}\n\nAfter: {b}\n\n'
              'One 48 mm CM5 body-outline segment, originally on B.SilkS from Module301, crossed SW101/SW501 solder-mask pad openings. '
              'Moved the identical stroke to B.Fab, leaving full visual CM5 outline in assembly drawings while keeping all connector and board markings elsewhere unchanged. '
              'Updated project-local CM5IO library corresponding F.SilkS stroke to F.Fab; KiCad native pad/trace/zone comparison verified no electrical change. '
              'Six soldermask/silkscreen collision warnings were removed without disabling fabrication checks.\n',encoding='utf-8')
          PY
      - name: Commit verified artwork fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cm5_mini_host/CM5_MINIMA_3.kicad_pcb cm5_mini_host/CM5IO.pretty/Raspberry-Pi-5-Compute-Module_GPIO.kicad_mod cm5_mini_host/CM5_BODY_SILK_VS_SWITCH_AUDIT.md
          git commit -m "Keep CM5 body outline on Fab not on switches, preserve copper and labels"
          git push origin HEAD:minihost-revA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-body-silk-switch-clearance
          path: reports/
