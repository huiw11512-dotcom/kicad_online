name: CM5 MiniHost electrical / high-speed audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'cm5_mini_host/**'
      - '.github/workflows/cm5-minihost-check.yml'

permissions:
  contents: read

jobs:
  kicad-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10 (official PPA)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols kicad-templates python3
          kicad-cli version
      - name: Run electrical and design-rule checks
        shell: bash
        run: |
          set -u
          mkdir -p reports
          cd cm5_mini_host
          kicad-cli sch erc CM5_MINIMA_3.kicad_sch -o ../reports/erc.rpt
          E=$?
          kicad-cli pcb drc CM5_MINIMA_3.kicad_pcb -o ../reports/drc.rpt --schematic-parity
          D=$?
          echo "Schematic command status: $E, PCB command status: $D" | tee ../reports/command_status.txt
          test -f ../reports/erc.rpt && test -f ../reports/drc.rpt
      - name: Extract measured copper-route and P-N difference inventory
        shell: bash
        run: |
          /usr/bin/python3 cm5_mini_host/scripts/pcb_audit.py cm5_mini_host/CM5_MINIMA_3.kicad_pcb reports
      - name: Export measured USB physical route and viewer
        shell: bash
        run: |
          /usr/bin/python3 cm5_mini_host/scripts/usb_route_inventory.py
      - name: Summarize reports — do not confuse CI green with DRC clean
        shell: bash
        run: |
          echo '## CM5 MiniHost audit' >> "$GITHUB_STEP_SUMMARY"
          echo '### ERC / DRC headings' >> "$GITHUB_STEP_SUMMARY"
          grep -hE 'Found [0-9]+|ERC messages:|DRC violations|Unconnected pads' reports/erc.rpt reports/drc.rpt >> "$GITHUB_STEP_SUMMARY" || true
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat reports/board_inventory.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/command_status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm5-minihost-audit
          path: reports/
          if-no-files-found: warn

      - name: Manufacturing release gate — fail on electrical / copper rule errors
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          erc=Path('reports/erc.rpt').read_text(errors='replace') if Path('reports/erc.rpt').exists() else ''
          drc=Path('reports/drc.rpt').read_text(errors='replace') if Path('reports/drc.rpt').exists() else ''
          m=re.search(r'ERC messages:\s*\d+\s+Errors\s+(\d+)',erc)
          errors=int(m.group(1)) if m else 9999
          drc_errors=len(re.findall(r';\s*error\s*$',drc,re.M))
          print('Schematic ERC errors:',errors,'PCB DRC errors:',drc_errors)
          if errors or drc_errors:
              sys.exit('BLOCKED: Fix or explicitly review reported errors before fabrication release')
          PY
