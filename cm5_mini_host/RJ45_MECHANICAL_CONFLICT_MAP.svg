<circle cx="83.996" cy="27" r=".19" fill="#862f05"/>
<circle cx="83.996" cy="45.3" r=".19" fill="#862f05"/>
<path d="M 85 26 L 103.2 22.0 L 107 22" stroke="#9c5a17" stroke-width=".17" fill="none"/>
