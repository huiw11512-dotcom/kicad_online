<path d="M 76.016 25.599 L 80.109 20.947 L 81.581 22.441 L 85.142 23.93 L 126.133 23.93" fill="none" stroke="#132d44" stroke-width=".18" stroke-dasharray=".35,.25"/>
<rect x="75.897" y="24.9" width="24.379" height="22.5" rx=".4" fill="#e1ecff" fill-opacity=".4" stroke="#3573b7" stroke-width=".20" stroke-dasharray=".45,.27"/>
