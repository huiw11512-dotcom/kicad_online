<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 15 76 72" width="1140" height="1080" role="img" aria-labelledby="title desc">
<title id="title">CM5 MiniHost Rev.A RJ45 Mechanical Conflict Map</title>
<desc id="desc">Measured KiCad PCB J1 RJ45 shell pads 15 and 16 near Edge.Cuts notch. J601 fan connector and H102 mounting hole have courtyard overlaps with J1. This engineering visualization uses measured positions; it is not Gerber geometry.</desc>
