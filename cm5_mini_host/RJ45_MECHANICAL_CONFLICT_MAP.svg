<g font-family="Arial,sans-serif" font-size="1.6" fill="#243247">
<text x="72" y="85" font-size="1.2">Geometry derived from KiCad pad locations and broad footprint bounding boxes (mm). NOT a manufacturing/assembly drawing.</text>
<text x="75.2" y="49.5" font-size="1.45">RJ45 J1 bounding box</text>
<text x="107" y="18" font-size="1.55" fill="#b33648">H102 mounting hole</text>
<text x="107" y="20.0" font-size="1.1">center (78.15,23.35)</text>
<text x="107" y="22.5" font-size="1.55" fill="#9c5a17">J1 pad 16 / upper notch</text>
<text x="107" y="24.5" font-size="1.12">edge clearance 0.1914 mm</text>
<text x="107" y="33.5" font-size="1.55" fill="#9c5a17">J1 pad 15 / lower notch</text>
<text x="107" y="35.5" font-size="1.12">edge clearance 0.2164 mm</text>
<text x="107" y="45.5" font-size="1.55" fill="#147549">J601 fan connector</text>
<text x="107" y="47.5" font-size="1.12">courtyard overlap with J1</text>
<text x="107" y="53" font-size="1.12">J1 nominal envelope</text>
<text x="107" y="55" font-size="1.12">x 75.897..100.276</text>
<text x="107" y="57" font-size="1.12">y 24.9..47.4</text>
<text x="107" y="62" font-size="1.12">Current edge rule: ≥0.372 mm</text>
<text x="107" y="64.0" font-size="1.12">Only board-design review can</text>
<text x="107" y="66.0" font-size="1.12">decide solder land/overhang.</text>
<text x="107" y="71" font-size="1.12">Official Kycon A4 (2025)</text>
<text x="107" y="73" font-size="1.12">footprint drawing required.</text>
<text x="107" y="78" font-size="1.12">No PCB copper changed</text>
<text x="107" y="80" font-size="1.12">by this visualization.</text>
